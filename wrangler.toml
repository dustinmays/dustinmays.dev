# Cloudflare Workers static-assets deploy for dustinmays.dev.
# Modern static-assets config — not the legacy Pages adapter.
# Custom domain wiring is done in the Cloudflare dashboard against the existing
# dustinmays.dev zone.

name = "dustinmays-dev"
main = "worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
